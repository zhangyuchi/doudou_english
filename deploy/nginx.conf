# Example server block: edit server_name and root, then include under nginx's http block.
# HTTP only; configure HTTPS separately before public production use.
server {
    listen 80;
    server_name english.example.com;
    root /srv/doudou-english/current;
    index index.html;
    autoindex off;
    open_file_cache off;

    # A self-contained MIME map avoids dependence on the host's .mjs mapping.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/wasm wasm;
        application/pdf pdf;
        text/plain txt;
        text/csv csv;
    }
    default_type application/octet-stream;

    # Avoid stale entry pages after publishing; this applies to all files for simplicity.
    add_header Cache-Control "no-cache" always;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
