<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#153e35" />
    <title>听写时光 · 英音纸上听写</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./"
        ><span class="brand-icon" aria-hidden="true">Aa</span
        ><span>听写时光<small>PAPER & VOICE</small></span></a
      >
      <span class="dialect-tag"><span></span>英国英语 · 纸上听写</span>
    </header>
    <main class="workspace">
      <aside class="sidebar">
        <div class="sidebar-heading">
          <span class="eyebrow">你的词表</span>
        </div>
        <h1 id="source-title">外研社七年级英语</h1>
        <p id="source-summary" class="muted"></p>
        <div class="source-actions">
          <button id="builtin-button" class="text-button">返回内置词表</button
          ><button id="glossary-open" class="text-button" type="button">
            查看原词表
          </button>
        </div>
        <div id="group-list" class="group-list" aria-label="选择听写分组"></div>
        <button id="mistakes-open" class="mistakes-button">
          错词复习 <span id="mistakes-count">0</span>
        </button>
        <p class="sidebar-note">准备好纸和笔。<br />让耳朵听，让手记住。</p>
      </aside>
      <section class="practice-panel" aria-label="练习区">
        <div class="practice-top">
          <div>
            <span class="eyebrow">一步一步，慢慢记住</span>
            <h2 id="group-title">第 1 组</h2>
          </div>
          <span id="item-count" class="count-tag"></span>
        </div>
        <nav class="mode-tabs" aria-label="练习模式">
          <button data-mode="review" aria-pressed="true">① 复习单词</button>
          <button data-mode="dictation" aria-pressed="false">② 纸上听写</button>
          <button data-mode="answers" aria-pressed="false">③ 核对答案</button>
        </nav>
        <div id="message" class="message" role="status" hidden></div>
        <div id="storage-warning" class="message warning" hidden>
          <span></span
          ><button id="storage-recover" hidden>替换损坏记录并保存</button>
        </div>
        <section class="voice-settings" aria-label="英国英语声音">
          <div class="voice-label">
            <span class="voice-dot" aria-hidden="true"></span
            ><label for="voice-select">英国英语声音</label>
          </div>
          <div class="voice-controls">
            <select id="voice-select" aria-label="英国英语声音"></select
            ><button id="voice-preview" class="small-button">试听</button
            ><button
              id="voices-refresh"
              class="icon-button"
              aria-label="刷新声音列表"
            >
              ↻
            </button>
          </div>
          <p id="voice-help" class="muted">正在准备英音…</p>
        </section>
        <div id="review-view">
          <p class="section-intro">点击单词听发音，读熟之后再开始听写。</p>
          <div id="review-list" class="word-list"></div>
          <button id="review-start" class="primary-button wide">
            准备好了，开始听写 →
          </button>
        </div>
        <div id="dictation-view" hidden>
          <section class="dictation-stage">
            <p id="progress-label" class="eyebrow">准备开始</p>
            <div id="countdown-disc" class="countdown-disc">
              <span id="countdown-number" aria-hidden="true">▶</span>
            </div>
            <h3 id="playback-title">听一词，写一词。</h3>
            <p id="playback-help" class="muted">
              答案暂时隐藏，拿起笔就可以开始。
            </p>
            <div
              class="progress-track"
              role="progressbar"
              aria-label="听写进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="progress-fill"></div>
            </div>
          </section>
          <div class="playback-controls">
            <button id="previous" class="secondary-button">← 上一个</button
            ><button id="play-toggle" class="primary-button">开始听写</button
            ><button id="next" class="secondary-button">下一个 →</button>
          </div>
          <button id="replay" class="replay-button">↻ 重播当前词</button>
          <section class="rhythm-settings" aria-label="听写节奏">
            <div>
              <label for="repeat-select">每词朗读</label
              ><select id="repeat-select">
                <option value="1">1 次</option>
                <option value="2">2 次</option>
                <option value="3">3 次</option>
              </select>
            </div>
            <div class="interval-setting">
              <label for="interval-input">书写间隔</label>
              <div class="interval-options">
                <button data-interval="5">5 秒</button
                ><button data-interval="8">8 秒</button
                ><button data-interval="10">10 秒</button
                ><button data-interval="15">15 秒</button>
              </div>
              <div class="custom-interval">
                <span>自定义</span
                ><input
                  id="interval-input"
                  type="number"
                  min="1"
                  max="60"
                  step="1"
                  inputmode="numeric"
                  value="10"
                  aria-label="自定义书写间隔（秒）"
                /><span>秒</span>
              </div>
            </div>
            <p class="settings-note">
              最后一遍读完后开始计时；多次朗读之间停顿 1 秒。暂停后可调整设置。
            </p>
          </section>
          <button id="show-answers" class="text-button answers-link">
            展开本组答案，核对纸上听写 →
          </button>
        </div>
        <div id="answers-view" hidden>
          <p class="section-intro">对照纸上的答案，勾选写错或不熟悉的词。</p>
          <div id="answers-list" class="word-list"></div>
          <button id="wrong-practice" class="primary-button wide">
            练习这份词表的错词 →
          </button>
        </div>
      </section>
    </main>
    <footer>
      每次一组，每天一点。<span>设置与错词保存在当前浏览器。</span>
    </footer>
    <dialog id="glossary-dialog" class="glossary-dialog">
      <div class="dialog-heading">
        <div>
          <span id="glossary-eyebrow" class="eyebrow"></span>
          <h2 id="glossary-title">原词表</h2>
        </div>
        <button id="glossary-close" class="icon-button" aria-label="关闭原词表">
          ×
        </button>
      </div>
      <p id="glossary-summary" class="muted"></p>
      <div class="glossary-scroll">
        <table class="glossary-table">
          <caption id="glossary-caption" class="visually-hidden"></caption>
          <thead>
            <tr>
              <th class="w-group" scope="col">组</th>
              <th class="w-english" scope="col">英文</th>
              <th class="w-phonetic" scope="col">音标</th>
              <th class="w-chinese" scope="col">中文</th>
              <th class="w-extension" scope="col">扩展</th>
            </tr>
          </thead>
          <tbody id="glossary-body"></tbody>
        </table>
      </div>
    </dialog>
    <script type="module" src="/src/app.js"></script>
    <footer>
      <p>
        英音由开放录音与本地合成提供 ·
        <a href="./audio/credits.html" target="_blank" rel="noopener"
          >来源与许可</a
        >
      </p>
    </footer>
  </body>
</html>
